<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>MDY Attendance Portal</title>
<style>
  :root {
    --navy:#202b5d; --navy-deep:#161f45; --sky:#b2dff8; --ink:#0f1730;
    --bar:56px; --radius:20px;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; margin:0; }
  body {
    font-family:-apple-system,'Segoe UI',Roboto,system-ui,sans-serif;
    background:linear-gradient(165deg,#f4f8fd 0%,#e6eefa 55%,#dce8f7 100%);
    color:var(--ink); overflow:hidden; user-select:none;
  }

  /* ---------- nav bar: back / forward / home / refresh ---------- */
  #bar {
    position:fixed; inset:0 0 auto 0; height:var(--bar); z-index:10;
    display:none; align-items:center; gap:4px; padding:0 8px;
    background:var(--navy); box-shadow:0 2px 10px rgba(15,23,48,.28);
  }
  #bar.on { display:flex; }
  #bar button {
    flex:0 0 auto; width:52px; height:42px; border:0; border-radius:12px;
    background:rgba(255,255,255,.10); color:#fff; font-size:19px; line-height:1;
    display:grid; place-items:center; cursor:pointer; transition:background .12s,transform .08s;
  }
  #bar button:active { transform:scale(.93); background:rgba(255,255,255,.26); }
  #bar button[disabled] { opacity:.34; }
  #barTitle {
    flex:1 1 auto; min-width:0; color:#fff; font-size:15px; font-weight:600;
    letter-spacing:.2px; text-align:center; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; padding:0 6px;
  }

  /* ---------- app frame ---------- */
  #frameWrap { position:fixed; inset:var(--bar) 0 0 0; display:none; background:#fff; }
  #frameWrap.on { display:block; }
  #frameWrap iframe { width:100%; height:100%; border:0; display:none; }
  #frameWrap iframe.on { display:block; }

  /* ---------- selector ---------- */
  #home {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:clamp(18px,4vh,44px) clamp(16px,5vw,48px); overflow-y:auto;
  }
  #home.off { display:none; }
  /* Refresh on the HOME screen. The nav bar (with its own refresh) is deliberately hidden here,
     so without this the one page staff cannot reload is the portal itself - exactly the page that
     goes stale when GitHub Pages serves a cached copy. Corey asked for it 2026-09-14. */
  #homeRefresh {
    position:absolute; top:clamp(10px,2vh,18px); right:clamp(10px,2.5vw,20px);
    width:56px; height:56px; border-radius:16px; z-index:5;
    background:#fff; color:var(--navy); font-size:26px; line-height:1;
    display:grid; place-items:center; cursor:pointer;
    border:1px solid #dfe7f5; box-shadow:0 2px 10px rgba(32,43,93,.16);
    transition:background .12s,transform .08s;
  }
  #homeRefresh:active { transform:scale(.92); background:#eef3fb; }
  .brand { display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:clamp(14px,3vh,30px); }
  .brand img { width:clamp(92px,17vh,150px); height:auto; filter:drop-shadow(0 5px 14px rgba(32,43,93,.22)); }
  .brand h1 {
    margin:0; font-size:clamp(20px,4.2vw,30px); font-weight:800; line-height:1.15;
    letter-spacing:-.4px; color:var(--navy); text-align:center; text-wrap:balance;
  }
  .brand p { margin:0; font-size:clamp(13px,2.6vw,16px); color:#5b678c; font-weight:500; }

  .menu { width:100%; max-width:620px; display:flex; flex-direction:column; gap:clamp(12px,2.2vh,20px); }

  .card {
    position:relative; display:flex; align-items:center; gap:clamp(14px,3vw,22px);
    width:100%; padding:clamp(18px,3.2vh,28px) clamp(18px,4vw,28px);
    border:0; border-radius:var(--radius); cursor:pointer; text-align:left;
    background:#fff; color:var(--ink);
    box-shadow:0 3px 10px rgba(32,43,93,.10),0 12px 30px rgba(32,43,93,.09);
    transition:transform .11s ease, box-shadow .11s ease;
    font-family:inherit;
  }
  .card:active { transform:translateY(2px) scale(.988); box-shadow:0 2px 7px rgba(32,43,93,.13); }
  .card::before {
    content:""; position:absolute; left:0; top:14%; bottom:14%; width:6px;
    border-radius:0 6px 6px 0; background:var(--accent,var(--navy));
  }
  .ico {
    flex:0 0 auto; width:clamp(54px,10vw,68px); height:clamp(54px,10vw,68px);
    border-radius:17px; display:grid; place-items:center;
    background:var(--accent-soft,#eef3fb); color:var(--accent,var(--navy));
  }
  .ico svg { width:58%; height:58%; stroke:currentColor; fill:none;
             stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .txt { min-width:0; }
  .txt b { display:block; font-size:clamp(17px,3.5vw,22px); font-weight:750; letter-spacing:-.2px; }
  .txt span { display:block; margin-top:3px; font-size:clamp(12.5px,2.5vw,15px); color:#657294; }
  .chev { margin-left:auto; flex:0 0 auto; color:#aab4cd; font-size:24px; }

  .sub { display:none; flex-direction:column; gap:10px; padding:2px 0 0 clamp(14px,5vw,34px); }
  .sub.on { display:flex; }
  .sub .card { padding:clamp(13px,2.2vh,18px) clamp(16px,3.4vw,22px); background:#fbfcff; }
  .sub .ico { width:clamp(42px,7.4vw,50px); height:clamp(42px,7.4vw,50px); font-size:clamp(19px,3.8vw,23px); border-radius:13px; }
  .sub .txt b { font-size:clamp(15px,2.9vw,18px); }

  .foot { position:absolute; left:0; right:0; bottom:14px; padding-top:0; font-size:12px; color:#8b95b2; text-align:center; }
  .warn {
    margin:14px 0 0; padding:13px 16px; border-radius:13px; font-size:13.5px; line-height:1.45;
    background:#fff5f5; color:#8d2434; border:1px solid #f6d3d7; display:none; max-width:620px;
  }
  .warn.on { display:block; }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
</style>
</head>

    backyard:     { title:"Parent Pick-up - Backyard",   url:"https://staffes.mdy.org/Parent_Pickup/Parent_Pickup_Backyard.aspx" },
    parentlocker: { title:"ParentLocker Attendance",  url:"https://mdy.parentlocker.com/app/main/kiosk/136aef3c-7a3e-4cf5-b16b-a44988a95966" }
  };

  function fragParam(name) {
    var h = String(location.hash || "").replace(/^#/, "");
    var out = null;
    h.split("&").forEach(function (kv) {
      var i = kv.indexOf("=");
      if (i > 0 && decodeURIComponent(kv.slice(0, i)) === name) out = decodeURIComponent(kv.slice(i + 1));
    });
    return out;
  }
  var plUrl = fragParam("pl");
  if (plUrl && /^https:\/\//i.test(plUrl)) APPS.parentlocker.url = plUrl;

  var home = document.getElementById("home");
  var bar = document.getElementById("bar");
  var wrap = document.getElementById("frameWrap");
  var barTitle = document.getElementById("barTitle");
  var plWarn = document.getElementById("plWarn");

  // ONE IFRAME PER APP, created on first use and then KEPT ALIVE and merely hidden.
  // This is not a micro-optimisation: the ParentLocker kiosk asks for its unlock passcode on
  // every page load and persists nothing (no cookie, no localStorage, verified 2026-09-11), so
  // its unlocked state lives only in that frame's memory. Tearing the frame down on Home - which
  // an earlier build did - forced staff to re-enter the passcode every single time they came
  // back to it. Keeping the frame means the passcode is entered once per portal load.
  var frames = {};
  function frameFor(key) {
    if (!frames[key]) {
      var f = document.createElement("iframe");
      f.title = APPS[key].title;
      f.setAttribute("allow", "camera *; microphone *; fullscreen *");
      f.setAttribute("allowfullscreen", "");
      f.setAttribute("referrerpolicy", "no-referrer-when-downgrade");
      f.src = APPS[key].url;
      wrap.appendChild(f);
      frames[key] = f;
    }
    return frames[key];
  }

  var stack = ["home"], pos = 0;

  function render() {
    var view = stack[pos];
    Object.keys(frames).forEach(function (k) { frames[k].classList.toggle("on", k === view); });
    if (view === "home") {
      home.classList.remove("off");
      wrap.classList.remove("on");
      bar.classList.remove("on");
    } else {
      frameFor(view).classList.add("on");
      home.classList.add("off");
      wrap.classList.add("on");
      bar.classList.add("on");
      barTitle.textContent = APPS[view].title;
    }
    document.getElementById("bBack").disabled = (pos === 0);
    document.getElementById("bFwd").disabled = (pos >= stack.length - 1);
  }

  function go(view) {
    stack = stack.slice(0, pos + 1);
    stack.push(view);
    pos = stack.length - 1;
    render();
  }

  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-app],[data-toggle]");
    if (!t) return;
    var toggle = t.getAttribute("data-toggle");
    if (toggle) {
      var el = document.getElementById(toggle);
      var open = el.classList.toggle("on");
      document.getElementById("pickupChev").style.transform = open ? "rotate(90deg)" : "";
      return;
    }
    var key = t.getAttribute("data-app");
    if (!APPS[key].url) { plWarn.classList.add("on"); return; }
    go(key);
  });

  document.getElementById("bBack").addEventListener("click", function () {
    if (pos > 0) { pos--; render(); }
  });
  document.getElementById("bFwd").addEventListener("click", function () {
    if (pos < stack.length - 1) { pos++; render(); }
  });
  document.getElementById("bHome").addEventListener("click", function () {
    if (stack[pos] !== "home") { go("home"); }
  });
  // Refresh is the ONLY thing that discards an app's state - including a ParentLocker unlock.
  document.getElementById("bRefresh").addEventListener("click", function () {
    var view = stack[pos];
    if (view === "home") { location.reload(); return; }
    frames[view].src = APPS[view].url;
  });

  // Home-screen refresh: a hard reload of the portal itself. GitHub Pages caches hard, so a plain
  // reload can serve the same stale copy; the cache-busting query forces a genuine re-fetch.
  document.getElementById("homeRefresh").addEventListener("click", function () {
    location.replace(location.pathname + "?r=" + Date.now());
  });

  render();
})();
</script>
</body>
</html>
